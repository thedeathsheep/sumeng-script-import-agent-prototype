<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>塑梦AI - 剧本分镜导入 V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#0d1b34",
            muted: "#738199",
            line: "#dfe7f3",
            soft: "#f6f8fc",
            navy: "#101b34",
            brand: "#725cff",
            blue: "#3f7cff",
            good: "#16b889",
            warn: "#f3a72f",
            danger: "#d74462"
          },
          boxShadow: {
            panel: "0 18px 48px rgba(42, 62, 102, .12)",
            soft: "0 10px 28px rgba(42, 62, 102, .08)"
          }
        }
      }
    };
  </script>
  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #0d1b34;
      letter-spacing: 0;
      overflow: hidden;
      background: #f8fbff;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    .brand-mark {
      background: conic-gradient(from 210deg, #624fff, #d15bfd, #4ea2ff, #624fff);
      transform: rotate(-10deg);
    }
    .fade-left {
      mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .16) 16%, #000 38%, #000 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .16) 16%, #000 38%, #000 100%);
    }
    .direction-rtl { direction: rtl; text-align: left; }
    .direction-ltr { direction: ltr; }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d8e2f0; border-radius: 10px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
